name: Memo
options:
  bundleIdPrefix: com.hengji
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 签名身份由 scripts/build.sh 按本机证书情况注入（Apple Development / ad-hoc）
    CODE_SIGN_STYLE: Automatic
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO
    ONLY_ACTIVE_ARCH: YES
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Memo:
    type: application
    platform: macOS
    sources:
      - path: MemoApp
      - path: Shared
      - path: Icons/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Memo
        PRODUCT_BUNDLE_IDENTIFIER: com.hengji.memo
        INFOPLIST_FILE: MemoApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: MemoWidget
        embed: true
        codeSign: true

  MemoWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: MemoWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: MemoWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.hengji.memo.widget
        INFOPLIST_FILE: MemoWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_ENTITLEMENTS: build/MemoWidget.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  MemoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hengji.memo.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: ""
        TEST_HOST: ""

schemes:
  Memo:
    build:
      targets:
        Memo: all
        MemoWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemoTests
